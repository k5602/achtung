name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.23"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run ruff check src tests tools
      - run: uv run pytest -q
      - run: uv run achtung --need all --text "اكل في كفر الشيخ"
